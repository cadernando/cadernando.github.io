<head>

</head>

<body>

  <header class="topbar">
    <p class="site-title">espiral</p>
  </header>

  <nav>

    [ <a href="diario.html">diário</a> ]
    [ <a href="espiral.html">espiral</a> ]
  </nav>

  <div class="spiral-page">
    <svg class="fib-spiral fib-spiral-big" aria-hidden="true" viewBox="-9.5 -5.5 14 22">
      <g class="fib-squares">
        <rect x="0" y="0" width="1" height="1" />
        <rect x="-1" y="0" width="1" height="1" />
        <rect x="-1" y="1" width="2" height="2" />
        <rect x="1" y="0" width="3" height="3" />
        <rect x="-1" y="-5" width="5" height="5" />
        <rect x="-9" y="-5" width="8" height="8" />
        <rect x="-9" y="3" width="13" height="13" />
      </g>
      <path class="fib-curve"
        d="M 1 1 C 0.4477 1.0000, 0.0000 0.5523, 0 0 C -0.5523 0.0000, -1.0000 0.4477, -1 1 C -1.0000 2.1046, -0.1046 3.0000, 1 3 C 2.6569 3.0000, 4.0000 1.6569, 4 0 C 4.0000 -2.7614, 1.7614 -5.0000, -1 -5 C -5.4183 -5.0000, -9.0000 -1.4183, -9 3 C -9.0000 10.1797, -3.1797 16.0000, 4 16" />
    </svg>
  </div>

  <aside class="signature-widget">
    <p class="site-title small">cadernando.com</p>
    <p class="carimbo">cadernando.com :: v1.0 :: <span id="now-carimbo-date">22.09.2026</span></p>
  </aside>

  <aside class="now-widget">
    <div id="now-date">22.09.2026</div>
    <div>lendo :: <span id="now-lendo">Morangos mofados - Caio Fernando Abreu</span></div>
    <div>ouvindo :: <span id="now-ouvindo">Don't Know Why - Norah Jones</span></div>
  </aside>

  <script>
    (function () {
      var ENDPOINT = "https://cadernando-now-api.pontojf.workers.dev/";
      var POLL_MS = 30000;

      function formatDate(iso) {
        var d = new Date(iso);
        var dd = String(d.getDate()).padStart(2, "0");
        var mm = String(d.getMonth() + 1).padStart(2, "0");
        return dd + "." + mm + "." + d.getFullYear();
      }

      function setText(id, text) {
        var el = document.getElementById(id);
        if (el && text) el.textContent = text;
      }

      function refresh() {
        fetch(ENDPOINT)
          .then(function (res) { return res.ok ? res.json() : null; })
          .then(function (data) {
            if (!data) return;
            setText("now-ouvindo", data.listening);
            setText("now-lendo", data.reading);
            if (data.updated) {
              var date = formatDate(data.updated);
              setText("now-date", date);
              setText("now-carimbo-date", date);
            }
          })
          .catch(function () { /* mantém o último valor commitado */ });
      }

      refresh();
      setInterval(refresh, POLL_MS);
    })();
  </script>

</body>

</html>
